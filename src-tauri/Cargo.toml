[package]
name = "lantern"
version = "0.1.1"
description = "A lightweight local-network discovery and SSH desktop app"
authors = ["Kevin Hanna Rahhal and Lantern contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/kevin-rahhal/lantern"
homepage = "https://github.com/kevin-rahhal/lantern"
keywords = ["network", "discovery", "ssh", "terminal", "tauri"]
categories = ["network-programming"]

[lib]
name = "lantern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dns-lookup = "4.0"
futures = "0.3"
if-addrs = "0.15"
ipnet = "2.11"
keyring = "4.1.6"
macaddr-ouidb = "0.1.6"
mdns-sd = "0.21.0"
portable-pty = "0.9"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
